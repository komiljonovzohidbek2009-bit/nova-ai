<style>
:root{--bg:#080c18;--surface:#0e1527;--surface2:#141d33;--surface3:#192440;--border:#293653;--text:#f6f8ff;--muted:#9aa6bf;--accent:#765cff;--accent2:#4d8dff;--user:#273761;--shadow:0 18px 55px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
.app{height:100dvh;display:flex}.sidebar{width:278px;flex:0 0 278px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px}.brand{display:flex;align-items:center;gap:11px;padding:6px 5px 18px}.logo,.hero-logo{display:grid;place-items:center;color:#fff;font-weight:850;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 34px rgba(99,84,255,.25)}.logo{width:38px;height:38px;border-radius:12px}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.new-chat{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 13px;background:var(--surface2);color:var(--text);text-align:left;font-weight:650}.new-chat:hover{border-color:#4a5a7c;background:var(--surface3)}.history-title{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.13em;margin:23px 6px 9px}.history{flex:1;overflow:auto}.history button{width:100%;display:block;border:0;border-radius:10px;padding:10px;color:#cbd4e8;background:transparent;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history button.active{background:var(--surface2);color:var(--text)}.sidebar-foot{color:var(--muted);font-size:10px;padding:12px 5px 2px}
.main{min-width:0;flex:1;position:relative;display:flex;flex-direction:column}.topbar{height:62px;flex:0 0 62px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;padding:0 18px;background:rgba(8,12,24,.9);backdrop-filter:blur(16px)}.mobile-menu,.theme-btn{width:37px;height:37px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);display:grid;place-items:center}.mobile-menu{display:none}.topbar-title{font-weight:700}.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.status-dot{width:7px;height:7px;border-radius:50%;background:#55d88a}
.chat{flex:1;overflow:auto}.chat-inner{width:min(920px,100%);margin:0 auto;padding:30px 20px 165px;min-height:100%}.welcome{text-align:center;padding:7vh 0 28px}.hero-logo{width:66px;height:66px;border-radius:21px;font-size:25px;margin:0 auto 18px}.welcome h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.04em;line-height:1.05;margin:0 0 12px}.welcome p{max-width:650px;margin:0 auto;color:var(--muted);line-height:1.65;font-size:15px}.suggestions{max-width:760px;margin:30px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.suggestion{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;padding:14px;text-align:left;line-height:1.4}.suggestion:hover{background:var(--surface2);border-color:#4c5e83;transform:translateY(-1px)}
.message{display:flex;gap:12px;margin:24px 0;align-items:flex-start}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--surface3);color:#e6ebfa;font-size:11px;font-weight:800}.message.user .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.bubble{max-width:780px;padding:11px 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface2);line-height:1.65;white-space:pre-wrap;word-break:break-word}.message.user .bubble{background:var(--user);border-color:#385184}
.composer-zone{position:absolute;left:0;right:0;bottom:0;padding:17px 18px 19px;background:linear-gradient(transparent,var(--bg) 27%)}.attachment-strip{width:min(920px,100%);margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}.file-chip{display:flex;align-items:center;gap:7px;max-width:270px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-size:11px}.file-chip img{width:30px;height:30px;object-fit:cover;border-radius:7px}.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-chip button{border:0;background:transparent;color:var(--muted);font-size:17px}.composer{width:min(920px,100%);margin:0 auto;display:flex;align-items:flex-end;gap:9px;padding:8px 8px 8px 9px;background:var(--surface);border:1px solid #344361;border-radius:17px;box-shadow:var(--shadow)}.attach{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:25px}.attach:hover{background:var(--surface2)}textarea{min-height:27px;max-height:180px;resize:none;flex:1;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5;padding:8px 0}textarea::placeholder{color:#7e8aa3}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:21px;font-weight:800}.hint{text-align:center;color:#707c94;font-size:10px;margin-top:8px}
.attach-menu{position:absolute;left:max(18px,calc((100% - 920px)/2));bottom:94px;width:340px;display:none;flex-direction:column;padding:7px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:30}.attach-menu.open{display:flex}.attach-option{display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:10px;background:transparent;color:var(--text);padding:10px;text-align:left}.attach-option:hover{background:var(--surface2)}.attach-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:rgba(118,92,255,.12);font-size:17px}.attach-copy strong{display:block;font-size:13px}.attach-copy span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
body.light{--bg:#f6f8fc;--surface:#fff;--surface2:#f0f3f8;--surface3:#e8edf5;--border:#d5ddea;--text:#182230;--muted:#667085;--user:#e2e9ff;--shadow:0 18px 50px rgba(16,24,40,.12)}body.light .topbar{background:rgba(246,248,252,.9)}body.light .history button{color:#344054}body.light .history button.active,body.light .history button:hover{background:#e8edff;color:#172554}body.light .new-chat{background:#f8fafc;color:#182230;border-color:#cbd5e1}body.light .composer{background:#fff;border-color:#c5cfde}body.light .attach:hover{background:#eef2f7}body.light .suggestion{background:#fff;color:#182230}body.light .bubble{color:#182230}body.light .message.user .bubble{color:#172554}
@media(max-width:760px){body{overflow:hidden}.sidebar{position:fixed;left:-300px;top:0;bottom:0;z-index:50;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:grid}.status{display:none}.topbar{padding:0 11px}.topbar-title{font-size:15px}.chat-inner{padding:22px 13px 155px}.welcome{padding-top:6vh}.suggestions{grid-template-columns:1fr;margin-top:24px}.composer-zone{padding:12px 10px 13px}.attach-menu{left:10px;right:10px;bottom:83px;width:auto;display:none;flex-direction:row}.attach-menu.open{display:flex}.attach-option{flex:1;min-width:0;flex-direction:column;justify-content:center;text-align:center;gap:5px;padding:9px 4px}.attach-copy strong{font-size:11px}.attach-copy span{display:none}.attach-icon{width:32px;height:32px}}.overlay{display:none}.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
</style>

<body>
<noscript>
<section style="max-width:900px;margin:40px auto;padding:24px;font-family:system-ui;line-height:1.6">
<h1>Nova AI — Multilingual AI Assistant</h1>
<p>Nova AI is a multilingual AI assistant for learning, writing, research, brainstorming, and analyzing supported images and documents.</p>
<h2>What Nova AI can do</h2>
<ul><li>Answer questions and explain difficult topics</li><li>Help with writing, ideas, and study</li><li>Analyze supported images and documents</li><li>Continue conversations in multiple languages</li></ul>
</section>
</noscript>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="logo">N</div><div><strong>Nova AI</strong><small>Multilingual AI assistant</small></div></div>
<button class="new-chat" id="newChat" type="button">＋ New conversation</button>
<div class="history-title">Recent conversations</div><div class="history" id="history"></div>
<div class="sidebar-foot">Conversations are stored in this browser.</div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
<header class="topbar"><button class="mobile-menu" id="mobileMenu" type="button">☰</button><div class="topbar-title">Nova AI</div><div class="status"><span class="status-dot"></span> Ready</div><button class="theme-btn" id="themeBtn" type="button" title="Switch theme">☀</button></header>
<section class="chat" id="chat"><div class="chat-inner" id="messages">
<div class="welcome"><div class="hero-logo">N</div><h1>How can I help you?</h1><p>Ask anything, explore an idea, study a topic, improve your writing, or share an image or document for analysis.</p>
<div class="suggestions">
<button class="suggestion" type="button">Teach me a difficult topic step by step</button>
<button class="suggestion" type="button">Turn my idea into a creative project</button>
<button class="suggestion" type="button">Analyze an image and uncover what matters</button>
<button class="suggestion" type="button">Help me understand this text in simple words</button>
</div></div>
</div></section>
<div class="composer-zone">
<div class="attachment-strip" id="attachmentStrip"></div>
<div class="attach-menu" id="attachMenu">
<button class="attach-option" id="imageOption" type="button"><span class="attach-icon">🖼</span><span class="attach-copy"><strong>Images</strong><span>Photos and screenshots</span></span></button>
<button class="attach-option" id="documentOption" type="button"><span class="attach-icon">📄</span><span class="attach-copy"><strong>Documents</strong><span>PDF, Word, Excel and more</span></span></button>
<button class="attach-option" id="cameraOption" type="button"><span class="attach-icon">📷</span><span class="attach-copy"><strong>Camera</strong><span>Take a photo on mobile</span></span></button>
<button class="attach-option" id="textOption" type="button"><span class="attach-icon">📝</span><span class="attach-copy"><strong>Text file</strong><span>TXT, CSV, JSON, Markdown</span></span></button>
</div>
<form class="composer" id="composer">
<button class="attach" id="attachBtn" type="button" title="Add image or file">＋</button>
<input id="imageInput" type="file" hidden multiple accept="image/*">
<input id="documentInput" type="file" hidden multiple accept=".pdf,.txt,.csv,.md,.json,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
<input id="cameraInput" type="file" hidden accept="image/*" capture="environment">
<input id="textInput" type="file" hidden multiple accept=".txt,.csv,.md,.json">
<textarea id="input" rows="1" maxlength="12000" placeholder="Message Nova AI..."></textarea>
<button class="send" id="send" type="submit" title="Send">↑</button>
</form>
<div class="hint">Enter to send · Shift + Enter for a new line</div>
</div>
</main>
</div>

<script src="/config.js"></script>
<script>
"use strict";
const STORAGE="novaAI.conversations.v7", THEME="novaAI.theme", API_URL=(window.NOVA_API_URL||"").replace(/\/$/,"");
let conversations=load(), currentId=null, pending=[], busy=false;
const $=id=>document.getElementById(id), messages=$("messages"), chat=$("chat"), input=$("input"), send=$("send"), history=$("history"), sidebar=$("sidebar"), overlay=$("overlay"), menu=$("attachMenu"), strip=$("attachmentStrip");

function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(conversations))}catch{}}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function current(){return conversations.find(c=>c.id===currentId)||null}
function create(){const c={id:newId(),title:"New conversation",messages:[],updatedAt:Date.now()};conversations.unshift(c);currentId=c.id;save();renderHistory();renderMessages()}
function ensure(){if(!current())create();return current()}

function renderHistory(){history.innerHTML="";conversations.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c.title||"New conversation";b.className=c.id===currentId?"active":"";b.onclick=()=>{currentId=c.id;renderHistory();renderMessages();closeMobile()};history.appendChild(b)})}
function append(role,text,files=[]){const row=document.createElement("div");row.className="message "+role;const av=document.createElement("div");av.className="avatar";av.textContent=role==="user"?"You":"N";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=String(text||"");if(files.length){const list=document.createElement("div");list.className="message-files";files.forEach(f=>{const x=document.createElement("div");x.className="file-chip";x.textContent=((f.type||"").startsWith("image/")?"🖼 ":"📎 ")+(f.name||"file");list.appendChild(x)});bubble.appendChild(list)}row.append(av,bubble);messages.appendChild(row);chat.scrollTop=chat.scrollHeight}
function renderMessages(){const c=current();if(!c||!c.messages.length){messages.innerHTML='<div class="welcome"><div class="hero-logo">N</div><h1>How can I help you?</h1><p>Ask anything, explore an idea, study a topic, improve your writing, or share an image or document for analysis.</p><div class="suggestions"><button class="suggestion" type="button">Teach me a difficult topic step by step</button><button class="suggestion" type="button">Turn my idea into a creative project</button><button class="suggestion" type="button">Analyze an image and uncover what matters</button><button class="suggestion" type="button">Help me understand this text in simple words</button></div></div>';messages.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus();update()});return}messages.innerHTML="";c.messages.forEach(m=>append(m.role,m.content,m.files||[]))}
function update(){send.disabled=busy||(!input.value.trim()&&!pending.length)}
function renderPending(){strip.innerHTML="";pending.forEach((f,i)=>{const chip=document.createElement("div");chip.className="file-chip";if(f.type.startsWith("image/")){const img=document.createElement("img");img.src=URL.createObjectURL(f);img.alt="";chip.appendChild(img)}const s=document.createElement("span");s.textContent=f.name;chip.appendChild(s);const x=document.createElement("button");x.type="button";x.textContent="×";x.onclick=()=>{pending.splice(i,1);renderPending();update()};chip.appendChild(x);strip.appendChild(chip)})}
function addFiles(list){
  const incoming=Array.from(list||[]);
  const valid=incoming.filter(f=>f.size<=8*1024*1024);
  pending=pending.concat(valid).slice(0,4);
  renderPending();
  update();
}
function toggleMenu(force){menu.classList.toggle("open",typeof force==="boolean"?force:!menu.classList.contains("open"))}
function closeMobile(){sidebar.classList.remove("open");overlay.classList.remove("show")}
function setBusy(x){busy=x;input.disabled=x;$("attachBtn").disabled=x;update()}
function b64(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(file)})}
async function attachments(files){
  const out=[];
  for(const f of files.slice(0,4)){
    if(f.size>8*1024*1024)continue;
    const x={name:f.name,type:f.type||"application/octet-stream",size:f.size};
    if(f.type.startsWith("image/"))x.data=await b64(f);
    else if(f.type.startsWith("text/")||/\.(txt|csv|md|json)$/i.test(f.name))x.text=await f.text();
    else x.data=await b64(f);
    out.push(x);
  }
  return out;
}

async function ask(message,files){
  const endpoint=(API_URL||"")+"/api/chat";
  const c=current();
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    message,
    messages:(c?.messages||[]).slice(0,-1).map(m=>({role:m.role,content:m.content})),
    attachments:await attachments(files)
  })});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||"The AI server returned an error.");
  if(typeof data.answer!=="string"||!data.answer.trim())throw new Error("The AI server returned an empty answer.");
  return data.answer.trim();
}

async function sendMessage(){
  if(busy)return;
  const text=input.value.trim();if(!text&&!pending.length)return;
  const files=pending.slice(), meta=files.map(f=>({name:f.name,type:f.type,size:f.size}));
  const c=ensure();const title=text||files[0]?.name||"New conversation";if(!c.messages.length)c.title=title.length>42?title.slice(0,42)+"…":title;
  c.messages.push({role:"user",content:text||"Please analyze the attached file.",files:meta});c.updatedAt=Date.now();save();
  input.value="";input.style.height="auto";pending=[];renderPending();toggleMenu(false);renderHistory();renderMessages();setBusy(true);
  const typing=document.createElement("div");typing.className="message assistant";typing.innerHTML='<div class="avatar">N</div><div class="bubble">Thinking…</div>';messages.appendChild(typing);chat.scrollTop=chat.scrollHeight;
  try{const answer=await ask(text,files);typing.remove();c.messages.push({role:"assistant",content:answer,files:[]});c.updatedAt=Date.now();save();append("assistant",answer);renderHistory()}
  catch(e){typing.remove();append("assistant","Nova AI could not reach the AI server. Check that the backend is deployed and the API URL is configured."+(e?.message?"\n\n"+e.message:""))}
  finally{setBusy(false);input.focus()}
}

$("composer").onsubmit=e=>{e.preventDefault();sendMessage()};input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px";update()};input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}};
$("newChat").onclick=()=>{create();closeMobile();input.focus()};$("attachBtn").onclick=e=>{e.stopPropagation();toggleMenu()};$("imageOption").onclick=()=>{toggleMenu(false);$("imageInput").click()};$("documentOption").onclick=()=>{toggleMenu(false);$("documentInput").click()};$("cameraOption").onclick=()=>{toggleMenu(false);$("cameraInput").click()};$("textOption").onclick=()=>{toggleMenu(false);$("textInput").click()};
["imageInput","documentInput","cameraInput","textInput"].forEach(id=>$(id).onchange=()=>{addFiles($(id).files);$(id).value=""});
document.onclick=e=>{if(!menu.contains(e.target)&&e.target!==$("attachBtn"))toggleMenu(false)};$("mobileMenu").onclick=()=>{sidebar.classList.add("open");overlay.classList.add("show")};overlay.onclick=closeMobile;
$("themeBtn").onclick=()=>applyTheme(document.body.classList.contains("light")?"dark":"light");function applyTheme(t){document.body.classList.toggle("light",t==="light");$("themeBtn").textContent=t==="light"?"☾":"☀";try{localStorage.setItem(THEME,t)}catch{}}
let theme="dark";try{theme=localStorage.getItem(THEME)||"dark"}catch{}applyTheme(theme);
if(conversations.length)currentId=conversations.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;else create();renderHistory();renderMessages();update();
</script>
</body>
</html>
